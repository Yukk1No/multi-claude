name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: dropdown
    id: system
    attributes:
      label: System
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `multi-claude doctor`
      description: On Windows, `multi-claude doctor --selftest`. It shows the Claude version too.
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
